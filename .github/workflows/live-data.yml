name: live-data
on:
  schedule:
    # every 15 min during the wet season (Oct–Apr). Widen to */30 to halve CI
    # minutes; disable this workflow entirely as the off-season kill switch.
    - cron: "*/15 * * 1-4,10-12 *"
  workflow_dispatch: {}
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: live-data, cancel-in-progress: true }
jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch snapshots (fail keeps previous deployment — site ages it to STALE/EXPIRED)
        env: { SYNOPTIC_TOKEN: ${{ secrets.SYNOPTIC_TOKEN }} }
        run: |
          python3 scripts/fetch_rain.py --out site/data/rain_latest.json
          python3 scripts/fetch_alerts.py --out site/data/alerts_latest.json
      - name: freshness gate for thresholds (live dataset only)
        run: |
          if [ -f site/data/basins_eaton.json ]; then
            python3 scripts/ops_validate.py site/data/basins_eaton.json
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - uses: actions/deploy-pages@v4
